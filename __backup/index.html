<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Projects</title>
</head>

<body>
  <h1>Project List</h1>
  <ul id="project-list"></ul>

  <script>
    // Fetch the data from the text file
    fetch('projects.csv')
      .then(response => response.text())
      .then(data => {
        // Split the text data by new lines to get each row
        const lines = data.trim().split('\n');
        const listElement = document.getElementById('project-list');

        lines.forEach((line, index) => {
          // Split each line by comma
          const parts = line.split(',');

          if (parts.length >= 2) {
            const name = parts[0].trim();
            const note = parts[2] ? parts[2].trim() : '';

            const li = document.createElement('li');
            const a = document.createElement('a');

            // Attach the index number to the URL as a query parameter
            a.href = `project.html?id=${index}`;
            a.textContent = `${name} (${note})`;

            li.appendChild(a);
            listElement.appendChild(li);
          }
        });
      })
      .catch(error => console.error('Error loading data:', error));
  </script>
</body>

</html>
