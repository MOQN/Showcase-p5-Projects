<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Project Viewer</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    .top-nav {
      height: 50px;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #ccc;
    }

    /* Iframe container setup to hide the p5.js header */
    .iframe-container {
      width: 100%;
      height: calc(100% - 50px);
      overflow: hidden;
      position: relative;
    }

    /* Pull the iframe up to hide the top bar */
    .iframe-container iframe {
      border: none;
      width: 100%;
      height: calc(100% + 45px);
      margin-top: -45px;
    }
  </style>
</head>

<body>

  <div class="top-nav">
    <a href="index.html">⬅ Back to List</a>
    <strong id="student-name" style="margin-left: 20px;">Loading...</strong>
  </div>

  <div class="iframe-container">
    <iframe id="p5-iframe" scrolling="no"></iframe>
  </div>

  <script>
    // Extract the 'id' parameter from the current URL
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = parseInt(urlParams.get('id'));

    if (!isNaN(projectId)) {
      // Fetch the text file again to get the specific link
      fetch('projects.csv')
        .then(response => response.text())
        .then(data => {
          const lines = data.trim().split('\n');

          // Validate if the ID exists in the data
          if (projectId >= 0 && projectId < lines.length) {
            const parts = lines[projectId].split(',');
            const name = parts[0].trim();
            const p5Link = parts[1].trim();

            // Update the DOM elements with the fetched data
            document.getElementById('student-name').textContent = name;
            document.getElementById('p5-iframe').src = p5Link;
          } else {
            document.getElementById('student-name').textContent = "Project not found.";
          }
        })
        .catch(error => console.error('Error loading data:', error));
    } else {
      document.getElementById('student-name').textContent = "Invalid ID.";
    }
  </script>
</body>

</html>
